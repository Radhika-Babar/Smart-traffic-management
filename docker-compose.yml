services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: traffic
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d traffic"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://traffic:traffic@postgres:5432/traffic
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
      BACKEND_HOST: 0.0.0.0
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - modeldata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  modeldata:
